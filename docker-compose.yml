services:
  app:
    build: .
    container_name: e-alerte
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e-alerte-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - chatbot_data:/app/data

volumes:
  chatbot_data:
