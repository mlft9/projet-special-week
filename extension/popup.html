<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signaler IA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      height: 650px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #fff8e8;
      color: #2a1a0e;
      overflow: hidden;
    }

    .popup-container {
      padding: 16px;
      height: 100%;
      overflow-y: auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(147, 54, 0, 0.12);
      padding-bottom: 12px;
    }

    .header h2 {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #933600;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      opacity: 0.7;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #933600;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #e6d4a8;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      background: white;
      color: #2a1a0e;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #933600;
      box-shadow: 0 0 0 2px rgba(147, 54, 0, 0.1);
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit {
      background: #933600;
      color: white;
    }

    .btn-submit:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-cancel {
      background: #e6d4a8;
      color: #2a1a0e;
    }

    .btn-cancel:hover {
      opacity: 0.8;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status.error {
      background: rgba(154, 44, 44, 0.1);
      color: #9a2c2c;
      border: 1px solid rgba(154, 44, 44, 0.2);
      display: block;
    }

    .status.success {
      background: rgba(41, 107, 46, 0.1);
      color: #296b2e;
      border: 1px solid rgba(41, 107, 46, 0.2);
      display: block;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h2>Signaler IA</h2>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>

    <form id="reportForm">
      <div class="form-group">
        <label>URL du site</label>
        <input type="text" id="articleUrl" readonly style="background: #f5f0e8; cursor: not-allowed;">
      </div>

      <div class="form-group">
        <label>Nom du site</label>
        <input type="text" id="siteName" maxlength="120" placeholder="ex: actualites-x.com" required>
      </div>

      <div class="form-group">
        <label>Titre de l'article</label>
        <input type="text" id="articleTitle" maxlength="180" placeholder="Titre concerné" required>
      </div>

      <div class="form-group">
        <label>Type d'IA</label>
        <select id="aiUsageType" required>
          <option value="suspected">IA suspectée</option>
          <option value="declared">IA déclarée par le site</option>
          <option value="generated">Contenu probablement généré</option>
        </select>
      </div>

      <div class="form-group">
        <label>Raison du signalement</label>
        <textarea id="reportReason" maxlength="500" placeholder="Pourquoi ce contenu te semble problématique ?" required></textarea>
      </div>

      <div class="form-group">
        <label>Ton prénom (optionnel)</label>
        <input type="text" id="reporterName" maxlength="80" placeholder="Prénom">
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-cancel" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn btn-submit" id="submitBtn">Signaler</button>
      </div>

      <div class="status" id="status"></div>
    </form>
  </div>

  <script src="popup.js"></script>
</body>
</html>
